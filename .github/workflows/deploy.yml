name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  # 每天 01:00 UTC = 北京时间 09:00 重新构建一次。
  # 构建脚本只渲染 date <= 构建时刻 的文章，所以约定在 08:30 发布的文章，
  # 到点后由这一次定时重建推上线上；没到点的文章不会被渲染出来。
  # 留到 09:00 是为了给公众号发布后补 wechatUrl 并推送留出时间。
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
